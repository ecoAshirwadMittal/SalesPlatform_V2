spring:
  application:
    name: salesplatform

  # ─────────────────────────────────────
  # Load secrets from the repo-root .env (gitignored). `optional:` means
  # startup doesn't fail in CI/Docker where the file is absent; `[.properties]`
  # tells the Spring config importer to parse KEY=VALUE lines as properties.
  # Any key here (e.g. SNOWFLAKE_ENABLED, SNOWFLAKE_USERNAME) becomes
  # resolvable via ${SNOWFLAKE_ENABLED} in this file, matching OS-env behavior.
  # Shell-exported env vars still win — Spring property precedence gives OS
  # env higher priority than imported config files.
  # ─────────────────────────────────────
  config:
    import: optional:file:../.env[.properties]

  # ─────────────────────────────────────
  # Multipart uploads — covers the Sprint 4 buyer photo-upload endpoint
  # (partial_credit.credit_request_photos). The 10MB cap is the parser
  # ceiling; the partial-credit-specific 5MB cap is enforced inside
  # CreditRequestPhotoService so file rejection produces our typed
  # PhotoUploadException response body (not Spring's generic 500).
  # ─────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

  # ─────────────────────────────────────
  # Local PostgreSQL (already running)
  # ─────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/salesplatform_dev
    username: ${DB_USERNAME:salesplatform}
    password: ${DB_PASSWORD:salesplatform}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  # ─────────────────────────────────────
  # JPA / Hibernate
  # validate = Hibernate checks entities match DB schema; never auto-creates
  # ─────────────────────────────────────
  jpa:
    open-in-view: false   # disable OSIV — prevents stale JPA L1 cache after REQUIRES_NEW commits
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: identity   # default schema for @Entity classes unless overridden
        jdbc:
          batch_size: 50
          time_zone: UTC           # ensures LocalDateTime ↔ TIMESTAMPTZ uses UTC
        order_inserts: true
        order_updates: true

  # ─────────────────────────────────────
  # Mail (SMTP) — used by SmtpEmailSender when pws.email.enabled=true.
  # Defaults are harmless placeholders; real creds injected via env in QA/prod.
  # ─────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    # Password only ever comes from env (design decision D2, email-management-design-2026-07-10.md) —
    # never DB/API. EmailSmtpValidator fails startup in production if enabled=true and this is blank.
    password: ${EMAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ─────────────────────────────────────
  # Flyway Migration
  # ─────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: true
    schemas: identity,user_mgmt,buyer_mgmt,sso,pws,mdm,integration,email,admin
    default-schema: identity  # flyway_schema_history lives in identity (matches pom.xml)

# ─────────────────────────────────────
# Actuator (health checks)
# ─────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # L-2 (security review 2026-07-10): gate full health detail to Administrator.
      # With show-details=when-authorized, component detail (DB / disk / host
      # internals) is only revealed to a caller holding one of these roles; a
      # plain authenticated Bidder now sees the rollup status only. The `local`
      # profile overrides show-details to `always` for dev convenience.
      roles: Administrator
  health:
    # Spring Boot auto-registers a JavaMail health indicator that probes the
    # SMTP host on every /actuator/health hit. With no SMTP server running
    # locally (or in CI) the rollup flips to DOWN even though the app is fully
    # functional — and the E2E test gate (`isBackendAvailable`) skips every
    # live test as a result. Mail is non-essential to the auction surface;
    # exclude the indicator from the rollup. Status is still queryable
    # individually via `/actuator/health/mail` if needed.
    mail:
      enabled: false

# ─────────────────────────────────────
# Server
# ─────────────────────────────────────
server:
  port: 8080
  error:
    include-message: never
    include-exception: false

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-32-bytes-long!!}
    # Aligned with the auth-cookie Max-Age (8h / 24h) so a token can never be used
    # (via the Authorization header) longer than the cookie implies — closes the
    # "token outlives its cookie" gap (security review 2026-07-10, H-8). Full
    # server-side revocation on logout / password-change is deferred: it needs a
    # stateful denylist or a per-user tokens-valid-after timestamp checked in the
    # JWT filter, a deliberate trade against the current stateless design.
    expiration-ms: 28800000          # 8h  (was 24h) — matches DEFAULT_TTL
    remember-me-expiration-ms: 86400000  # 24h (was 7d) — matches REMEMBER_ME_TTL

# ─────────────────────────────────────
# Auth cookie (Theme 3 — HttpOnly cookie-based JWT)
# Default secure=false so http://localhost dev works; QA/prod MUST set
# AUTH_COOKIE_SECURE=true (or activate the `production` profile below).
# SameSite=Strict and HttpOnly are enforced in code (non-configurable).
# ─────────────────────────────────────
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}

# ─────────────────────────────────────
# CORS allowlist — comma-separated origins. Override via CORS_ALLOWED_ORIGINS.
# ─────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.app}

# ─────────────────────────────────────
# PWS email notifications (Theme 1)
# enabled=false → LoggingEmailSender logs each message instead of sending.
# Flip enabled=true in QA/prod after SMTP creds are wired via env.
# ─────────────────────────────────────
pws:
  email:
    enabled: ${PWS_EMAIL_ENABLED:false}
    from: ${PWS_EMAIL_FROM:noreply@ecoatmdirect.com}
    sales-address: ${PWS_EMAIL_SALES:sales@ecoatmdirect.com}
    counter-offer-url: ${PWS_EMAIL_COUNTER_OFFER_URL:https://buy.ecoatmdirect.com/p/counter-offer}

# ─────────────────────────────────────
# Buyer Snowflake sync (PWS Data Center Phase 3.3)
# enabled=false → BuyerSnowflakeListener bean is not registered; events are
# published but silently dropped. Flip enabled=true in QA/prod once the
# buyer-sync Snowflake integration is wired.
# ─────────────────────────────────────
buyers:
  snowflake:
    enabled: ${BUYERS_SNOWFLAKE_ENABLED:false}

# ─────────────────────────────────────
# Snowflake (Theme 2 — aggregated inventory sync infrastructure)
# enabled=false → SnowflakeDataSourceConfig bean is not registered, so no
# connection is ever attempted in dev/test. Flip enabled=true in QA/prod
# after credentials are wired via env. Real creds live in .env (gitignored).
# ─────────────────────────────────────
snowflake:
  enabled: ${SNOWFLAKE_ENABLED:false}
  jdbc-url: ${SNOWFLAKE_JDBC_URL:jdbc:snowflake://ecoatm.snowflakecomputing.com/?db=ECO_DEV&schema=AUCTIONS&TIMEZONE=UTC}
  username: ${SNOWFLAKE_USERNAME:}
  password: ${SNOWFLAKE_PASSWORD:}
  pool:
    maximum-size: ${SNOWFLAKE_POOL_MAX:3}

# ─────────────────────────────────────
# Auction lifecycle scheduler (Sub-project 0)
# enabled=false → @Scheduled tick is suppressed; round transitions are only
# driven by direct service.tick() calls (used in tests). Polls every poll-ms
# milliseconds when enabled. Mirrors Mendix scheduled-event interval (60s).
# ─────────────────────────────────────
# ─────────────────────────────────────
# Buyer User Guide upload (Phase 12)
# Local disk storage; S3 is a follow-up.
# ─────────────────────────────────────
buyer-guide:
  upload-dir: ${BUYER_GUIDE_UPLOAD_DIR:uploads/buyer-user-guide}

auctions:
  lifecycle:
    enabled: ${AUCTIONS_LIFECYCLE_ENABLED:true}
    poll-ms: ${AUCTIONS_LIFECYCLE_POLL_MS:60000}
  # ─────────────────────────────────────
  # Auction status Snowflake push (Sub-project 1)
  # enabled=false → AuctionStatusSnowflakePushListener short-circuits before
  # any DB read; no payload is constructed and the writer is never invoked.
  # Flip enabled=true in QA/prod once the Snowflake-bound writer lands.
  # ─────────────────────────────────────
  snowflake-push:
    enabled: ${AUCTIONS_SNOWFLAKE_PUSH_ENABLED:false}
  # ─────────────────────────────────────
  # R1 initialization listener (Sub-project 2)
  # enabled=false → R1InitListener bean is not created; RoundStartedEvent(round=1)
  # is handled only by the stub. Flip enabled=true (default) so the real service
  # clamps target prices and seeds qualified_buyer_codes on every R1 transition.
  # ─────────────────────────────────────
  r1-init:
    enabled: ${AUCTIONS_R1_INIT_ENABLED:true}
  # ─────────────────────────────────────
  # R2 buyer assignment listener (Sub-project 5)
  # enabled=false → R2BuyerAssignmentListener bean is not created;
  # RoundStartedEvent(round=2) is not processed and no QBC seeding occurs.
  # Flip enabled=true (default) so the real service computes qualified
  # + special-treatment buyer codes and seeds bid_data on every R2 transition.
  # ─────────────────────────────────────
  r2-init:
    enabled: ${AUCTIONS_R2_INIT_ENABLED:true}
  # ─────────────────────────────────────
  # R3 pre-process listener (Sub-project 6)
  # enabled=false → R3PreProcessListener bean is not created;
  # RoundClosedEvent(round=2) is not processed and no R3 pre-process occurs.
  # Flip enabled=true (default) so the real service performs R3 pre-processing
  # on every R2 close.
  # ─────────────────────────────────────
  r3-preprocess:
    enabled: ${AUCTIONS_R3_PREPROCESS_ENABLED:true}
  # ─────────────────────────────────────
  # R3 initialization listener (Sub-project 6)
  # enabled=false → R3InitListener bean is not created;
  # RoundStartedEvent(round=3) is not processed and no R3 init occurs.
  # Flip enabled=true (default) so the real service performs R3 initialization
  # on every R3 transition.
  # ─────────────────────────────────────
  r3-init:
    enabled: ${AUCTIONS_R3_INIT_ENABLED:true}

# ─────────────────────────────────────
# RMA → Deposco status sync (gap-analysis #3 "Make RMA Functional", Task E)
# Background job (modern port of ACT_UpdateRMAFromDeposco): polls the Deposco
# reverse-logistics client for each in-flight RMA (non-terminal status + an
# Oracle number) and advances it to 'Received' when Deposco reports receipt.
#
# enabled=false (DEFAULT) → the @Scheduled tick short-circuits before any DB
# read; the job is fully wired but inert. No real Deposco reverse-logistics
# endpoint exists yet, so client=logging selects LoggingDeposcoRmaClient — a
# no-op that logs the intended poll and reports "no update". Flip enabled=true
# and point client at a real implementation once the Deposco RMA API lands.
# ─────────────────────────────────────
rma:
  deposco-sync:
    enabled: ${RMA_DEPOSCO_SYNC_ENABLED:false}
    fixed-delay-ms: 1800000          # 30 min poll cadence
    client: logging                  # logging (default, no-op) | http (future real client)
  oracle-create:
    # When true (default), an APPROVED RMA review triggers the AFTER_COMMIT
    # RmaOracleCreateListener → Oracle create (submitRma). Disable to suppress
    # auto-create in an environment while leaving the manual /resubmit-oracle
    # recovery endpoint working. The Oracle call itself still fails closed in
    # deployed profiles when the OracleConfig toggle is off (SIM only in local dev).
    enabled: ${RMA_ORACLE_CREATE_ENABLED:true}
  sync:
    # RMA → Snowflake push (SUB_SendRMADetailsToSnowflake). On a review
    # completion the AFTER_COMMIT RmaSnowflakePushListener snapshots the RMA and
    # pushes it to the AUCTIONS.UPSERT_RMA_DATA(?) stored proc. Legacy pushes on
    # BOTH approved and declined completions, so this is not outcome-gated.
    # enabled=false → the listener short-circuits before any snapshot/writer call.
    enabled: ${RMA_SYNC_ENABLED:true}
    # Writer selection: 'logging' (default, no-op that logs the would-be-pushed
    # row — keeps dev/test off a live Snowflake DataSource) | 'jdbc' (prod, calls
    # the stored proc via the snowflakeJdbcTemplate).
    writer: logging                  # logging (default) | jdbc

---
# ─────────────────────────────────────
# Profile: local (override for dev convenience)
# Activate with: --spring.profiles.active=local
#
# L-3 (security review 2026-07-10): `local` and `production` are MUTUALLY
# EXCLUSIVE — never activate them together (e.g. `--spring.profiles.active=
# production,local`). `local` widens the attack surface for dev convenience
# (actuator show-details: always, flyway/mappings exposed, full error
# messages, auth cookie Secure=false); combining it with `production` would
# leak those in a real deployment. Production runs with the `production`
# profile ONLY.
# ─────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  flyway:
    validate-on-migrate: false   # skip checksum validation in local dev
auth:
  cookie:
    secure: false   # allow auth cookie over http://localhost during dev
server:
  error:
    include-message: always
    include-exception: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,mappings
  endpoint:
    health:
      show-details: always

---
# ─────────────────────────────────────
# Profile: production
# Activate with: --spring.profiles.active=production
#
# L-3 (security review 2026-07-10): activate this profile ALONE. Never combine
# it with `local` (see the local-profile note above) — doing so re-opens the
# dev-only actuator detail, verbose errors, and Secure=false cookie in prod.
# ─────────────────────────────────────
spring:
  config:
    activate:
      on-profile: production
  flyway:
    out-of-order: false
    validate-on-migrate: true
  jpa:
    show-sql: false
auth:
  cookie:
    # M-2 (security review 2026-07-10): production serves over HTTPS only, so the
    # auth cookie MUST carry the Secure attribute. This overrides the fail-open
    # base default (auth.cookie.secure: ${AUTH_COOKIE_SECURE:false} — kept so
    # http://localhost dev keeps working). Do NOT remove this line: without it a
    # prod deploy could ship the auth cookie without Secure.
    secure: true    # prod MUST serve over HTTPS
server:
  error:
    include-message: never
    include-exception: false
# ─────────────────────────────────────
# M-4 (security review 2026-07-10): production CORS must NOT carry the ngrok
# wildcard origins from the base default (those are dev-tunnel only — a wildcard
# origin with allowCredentials=true is an exfiltration risk). Lock to the real
# prod origin; override via CORS_ALLOWED_ORIGINS (comma-separated) if the
# deployed hostname differs. There is intentionally NO ngrok pattern here.
# ─────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://buy.ecoatmdirect.com}

# ─────────────────────────────────────
# Sub-project 4A: ExchangeBid (EB) sync config
# ─────────────────────────────────────
eb:
  sync:
    enabled: true
    fixed-delay-ms: 1800000         # 30 min default pull cadence
    snowflake-timeout-seconds: 60
    writer: logging                  # switch to 'jdbc' for prod
    reader: logging                  # switch to 'jdbc' for prod

# ─────────────────────────────────────
# Sub-project 4B: PurchaseOrder (PO) sync config
# enabled=false → PurchaseOrderSnowflakePushListener short-circuits before
# any payload construction; events are published but no writer is invoked.
# Flip enabled=true (default) so PO state changes push to Snowflake.
# ─────────────────────────────────────
po:
  sync:
    enabled: true
    writer: logging                  # logging (default) | jdbc
    snowflake-timeout-seconds: 60

# ─────────────────────────────────────
# Sub-project 4C: Bid Ranking + Target Price recalc
# Per-process Snowflake writer selection. Default 'logging' is a no-op
# (logs the intended push); flip to 'jdbc' in prod to wire the real
# Snowflake MERGE writers.
# ─────────────────────────────────────
recalc:
  snowflake:
    bid-ranking-writer: logging      # logging | jdbc
    target-price-writer: logging     # logging | jdbc

# ─────────────────────────────────────
# Partial Credit Requests — Snowflake reader selection
# Default 'logging' returns empty results, so unit/IT tests don't need a
# live Snowflake DataSource. Flip to 'jdbc' in prod to wire
# AUCTIONS.VW_SALE_ORDER_SHIPMENT reads.
# ─────────────────────────────────────
partial-credit:
  snowflake:
    reader: logging                  # logging | jdbc
  # ─────────────────────────────────────
  # Review-completed email listener (Sprint 3 chunk 8, flipped on in
  # Sprint 4 chunk 8). The default is now `true` — Sprint 4 close-out
  # gates the production sender behind QA-realistic copy that's now
  # live in the partial_credit.email_templates table (Chunk 1 seed +
  # Chunk 3 admin editor). The PARTIAL_CREDIT_REVIEW_EMAIL_ENABLED
  # override remains so a dev / staging environment can disable the
  # listener without a code change. The flag is consumed via @Value
  # injection on the listener (not @ConditionalOnProperty) so the bean
  # exists and its tests run regardless of the value.
  # ─────────────────────────────────────
  review-completed-email:
    enabled: ${PARTIAL_CREDIT_REVIEW_EMAIL_ENABLED:true}
  # ─────────────────────────────────────
  # Submission-confirmation email listener (gap 2.5 Task 1). Fired when a
  # buyer submits a credit request (DRAFT -> PENDING_APPROVAL) and dispatched
  # asynchronously by CreditRequestSubmittedEmailListener. Default `true` so it
  # works out of the box; the PARTIAL_CREDIT_SUBMITTED_EMAIL_ENABLED override
  # lets a dev / staging environment disable the listener without a code
  # change. Consumed via @Value on the listener (not @ConditionalOnProperty) so
  # the bean + its tests exist regardless of the value.
  # ─────────────────────────────────────
  submitted-email:
    enabled: ${PARTIAL_CREDIT_SUBMITTED_EMAIL_ENABLED:true}
  # ─────────────────────────────────────
  # Buyer photo-upload limits (Sprint 4 chunk 4). The service enforces
  # these on every POST /photos request — they shadow the global
  # spring.servlet.multipart.max-file-size ceiling but produce typed
  # PhotoUploadException responses instead of Spring's generic 500.
  # ─────────────────────────────────────
  photo:
    max-size-mb: 5
    max-per-line: 5
    # Comma-separated MIME types. HEIC is included for iOS uploads.
    allowed-content-types: image/jpeg,image/png,image/heic,image/webp
